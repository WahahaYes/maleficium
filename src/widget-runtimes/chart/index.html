<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart</title>
    <style>
      /* an element's own display must never beat the hidden attribute */
      [hidden] {
        display: none !important;
      }
      /* The host owns the width, the content the height: nothing here
        sizes from the frame's height (the frame follows the document). */
      html,
      body {
        margin: 0;
        background: var(--m-figure-bg);
        color: var(--m-figure-ink);
        font: var(--m-size-small, 13px) / var(--m-leading, 1.4)
          var(--m-font-body, system-ui, sans-serif);
      }
      #chart {
        width: 100%;
      }
      /* Vega's bound inputs flow under the plot, wrapping, each a full
        touch target. */
      .vega-bindings {
        display: flex;
        flex-wrap: wrap;
        gap: var(--m-space-1, 4px) var(--m-space-3, 12px);
        padding: var(--m-space-2, 8px);
      }
      .vega-bindings:empty {
        display: none;
      }
      .vega-bind {
        display: flex;
        align-items: center;
        gap: var(--m-space-2, 8px);
        min-height: 44px;
      }
      .vega-bind input[type='range'] {
        min-width: 8rem;
      }
      .msg {
        padding: var(--m-space-3, 12px);
        color: color-mix(in srgb, var(--m-figure-ink) 72%, var(--m-figure-bg));
      }
      #tip {
        position: fixed;
        z-index: 1;
        max-width: min(20rem, calc(100vw - 8px));
        padding: 4px 8px;
        pointer-events: none;
        background: var(--m-tooltip-bg);
        color: var(--m-tooltip-fg);
        border: 1px solid var(--m-tooltip-border);
        border-radius: var(--m-radius, 4px);
        box-shadow: var(--m-shadow);
        overflow-wrap: anywhere;
      }
      .tip-title {
        font-weight: 600;
      }
      .tip-row {
        display: flex;
        gap: var(--m-space-2, 8px);
        justify-content: space-between;
      }
      .tip-value {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="chart" role="img"><div class="msg">Loading…</div></div>
    <div id="tip" role="tooltip" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
