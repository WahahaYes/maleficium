<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live equation</title>
    <style>
      /* The host owns the width, the content the height. */
      html,
      body {
        margin: 0;
        background: var(--m-figure-bg);
        color: var(--m-figure-ink);
        font: var(--m-size-small, 13px) / var(--m-leading, 1.4)
          var(--m-font-body, system-ui, sans-serif);
      }
      #equation {
        padding: var(--m-space-3, 12px) var(--m-space-3, 12px) var(--m-space-2, 8px);
        overflow-x: auto;
        text-align: center;
        font-family: var(--m-font-math, math);
        font-size: var(--m-size-base, 17px);
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: var(--m-space-2, 8px) var(--m-space-3, 12px);
        padding: 0 var(--m-space-3, 12px) var(--m-space-3, 12px);
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: var(--m-space-2, 8px);
        min-height: 44px;
      }
      .name {
        font-family: var(--m-font-math, math);
        font-style: italic;
      }
      input[type='range'] {
        accent-color: var(--m-figure-accent);
        width: min(12rem, 40vw);
      }
      input[type='number'],
      button {
        font: inherit;
        color: var(--m-figure-ink);
        background: var(--m-figure-bg);
        border: 1px solid color-mix(in srgb, var(--m-figure-ink) 30%, var(--m-figure-bg));
        border-radius: var(--m-radius, 4px);
      }
      input[type='number'] {
        width: 5.5em;
      }
      button {
        padding: 0 var(--m-space-2, 8px);
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--m-figure-accent);
        outline-offset: 2px;
      }
      #live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <div id="equation"></div>
    <div id="controls" role="group"></div>
    <p id="live" aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
