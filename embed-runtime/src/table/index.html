<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <style>
      /* an element's own display must never beat the hidden attribute */
      [hidden] {
        display: none !important;
      }
      /* Everything sits on the figure plate, in the plate's ink: the theme
        chose --m-figure-ink, --m-figure-surface and --m-figure-accent to
        read on --m-figure-bg in each mode. */
      /* The host owns the width, the content the height: nothing here
        sizes from the frame's height (the frame follows the document). */
      html,
      body {
        margin: 0;
        background: var(--m-figure-bg);
        color: var(--m-figure-ink);
        font: var(--m-size-small, 13px) / var(--m-leading, 1.4)
          var(--m-font-body, system-ui, sans-serif);
        --rule: color-mix(in srgb, var(--m-figure-ink) 18%, var(--m-figure-bg));
        --quiet: color-mix(in srgb, var(--m-figure-ink) 72%, var(--m-figure-bg));
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: var(--m-space-2, 8px);
        padding: var(--m-space-1, 4px) var(--m-space-2, 8px);
        border-bottom: 1px solid var(--rule);
      }
      .bar input {
        flex: 1;
        min-width: 0;
        min-height: 36px;
        font: inherit;
        color: inherit;
        background: var(--m-figure-surface);
        border: 1px solid var(--rule);
        border-radius: var(--m-radius, 4px);
        padding: 2px 6px;
      }
      .bar .count {
        color: var(--quiet);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid var(--m-figure-accent);
        outline-offset: -2px;
      }
      /* Rows in flow up to about a dozen, then the rows scroll here and the
        page scrolls past them. */
      .scroll {
        max-height: 480px;
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        padding: 2px var(--m-space-2, 8px);
        text-align: left;
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
      }
      th.num,
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--m-figure-surface);
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      th[aria-sort='ascending']::after {
        content: ' \25B2';
        color: var(--m-figure-accent);
      }
      th[aria-sort='descending']::after {
        content: ' \25BC';
        color: var(--m-figure-accent);
      }
      tbody tr:hover {
        background: color-mix(in srgb, var(--m-figure-accent) 12%, var(--m-figure-bg));
      }
      .msg {
        padding: var(--m-space-3, 12px);
        color: var(--quiet);
      }
    </style>
  </head>
  <body>
    <div id="app" role="group">
      <div class="bar">
        <input
          id="filter"
          type="search"
          placeholder="Filter, e.g. alpha or score>20"
          aria-label="Filter rows"
        />
        <span class="count" id="count" aria-live="polite"></span>
      </div>
      <div class="scroll"><div class="msg" id="msg">Loading…</div></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
