<!doctype html>
<!-- A fork of the built-in model viewer (model@1). viewer.js is the viewer:
     edit it directly, no build needed. three.js is vendored under vendor/. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model</title>
    <style>
      /* an element's own display must never beat the hidden attribute */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--m-figure-bg);
        color: var(--m-figure-ink);
        font: var(--m-size-small, 13px) / var(--m-leading, 1.4)
          var(--m-font-body, system-ui, sans-serif);
      }
      #view {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas:focus-visible {
        outline: 2px solid var(--m-figure-accent);
        outline-offset: -2px;
      }
      .msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--m-space-3, 12px);
        text-align: center;
        color: color-mix(in srgb, var(--m-figure-ink) 72%, var(--m-figure-bg));
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="view"><div class="msg" id="msg">Loading…</div></div>
    <script src="vendor/three/three.js"></script>
    <script src="bridge.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
