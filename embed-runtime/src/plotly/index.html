<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plotly figure</title>
    <style>
      /* The host owns the width, the content the height. */
      html,
      body {
        margin: 0;
        background: var(--m-figure-bg);
        color: var(--m-figure-ink);
        font: var(--m-size-small, 13px) / var(--m-leading, 1.4)
          var(--m-font-body, system-ui, sans-serif);
      }
      #plot {
        width: 100%;
      }
      .msg {
        padding: var(--m-space-3, 12px);
        color: color-mix(in srgb, var(--m-figure-ink) 72%, var(--m-figure-bg));
      }
    </style>
  </head>
  <body>
    <div id="plot" role="img"><div class="msg">Loading…</div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
