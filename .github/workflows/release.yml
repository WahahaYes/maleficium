# Draft a GitHub release for a version already prepared on main (manifests
# bumped, CHANGELOG section written). Builds every platform via build.yml and
# attaches the artifacts to a DRAFT release targeting the dispatched commit.
# Nothing is published and no tag exists until a person publishes the draft,
# which creates vX.Y.Z at that commit. Rerunning for the same version
# replaces the draft's assets.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (no leading v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs only from main (got $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version, CHANGELOG and tag
        env:
          VER: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VER" in (*[!0-9.]*|""|.*|*.|*..*) echo "::error::bad version $VER"; exit 1;; esac
          python3 scripts/release-meta.py check "$VER"
          python3 scripts/release-meta.py notes "$VER" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "::error::tag v$VER already exists; that version is published"
            exit 1
          fi
          if gh release view "v$VER" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::release v$VER is already published"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          VER: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          for f in dist/*; do
            case "${f##*/}" in
              (*_"$VER"_*) ;;
              (*) echo "::error::$f is not a $VER artifact"; exit 1 ;;
            esac
          done
          python3 scripts/release-meta.py notes "$VER" > notes.md
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release edit "v$VER" --draft --target "$GITHUB_SHA" --notes-file notes.md
            gh release upload "v$VER" --clobber dist/*
          else
            gh release create "v$VER" --draft --target "$GITHUB_SHA" \
              --title "v$VER" --notes-file notes.md dist/*
          fi
