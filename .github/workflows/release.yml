# Publish a GitHub release when a vX.Y.Z tag is pushed. scripts/release.sh
# pushes it on the merge commit of the release PR (only repository admins
# may create v* tags). Checks that the tag is on main and that the manifests
# and CHANGELOG are at X.Y.Z, builds every platform via build.yml, and
# publishes the release with the CHANGELOG section as its notes. A failed
# run can be rerun from the Actions tab; a leftover draft for the version is
# published in place.
name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag, main, manifests and CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in (*[!0-9.]*|""|.*|*.|*..*) echo "::error::bad version tag $GITHUB_REF_NAME"; exit 1;; esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
          python3 scripts/release-meta.py check "$VER"
          python3 scripts/release-meta.py notes "$VER" >/dev/null
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::release $GITHUB_REF_NAME is already published"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # Packages only: build.yml also uploads screenshot-* artifacts.
          pattern: '{linux,macos,windows}-*'
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ls -l dist
          for f in dist/*; do
            case "${f##*/}" in
              (*_"$VER"_*) ;;
              (*) echo "::error::$f is not a $VER artifact"; exit 1 ;;
            esac
          done
          python3 scripts/release-meta.py notes "$VER" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
            gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          fi
