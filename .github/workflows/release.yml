# Publish a GitHub release when a vX.Y.Z tag is pushed. scripts/release.sh
# pushes it on the merge commit of the release PR (only repository admins
# may create v* tags). Checks that the tag is on main and that the manifests
# and CHANGELOG are at X.Y.Z, builds every platform via build.yml, and
# publishes the release with the CHANGELOG section as its notes. A failed
# run can be rerun from the Actions tab; a leftover draft for the version is
# published in place.
name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # High: the tag usually lands right after the merge, while main's build
    # of the same commit is still running, and this job waits for it below.
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      built: ${{ steps.built.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Tag, main, manifests and CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in (*[!0-9.]*|""|.*|*.|*..*) echo "::error::bad version tag $GITHUB_REF_NAME"; exit 1;; esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
          uv run --no-project scripts/release-meta.py check "$VER"
          uv run --no-project scripts/release-meta.py notes "$VER" >/dev/null
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::release $GITHUB_REF_NAME is already published"
            exit 1
          fi
      # The tag lands on the release PR's merge commit, which main's push
      # run of build.yml is already testing: wait for it and reuse its
      # result, and only test here when there is none (a tag on an older
      # commit) or it failed. The platform packages always rebuild in the
      # build job below (a tag run pays full LTO); only test suites skip.
      - name: Main's build of this commit
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow build.yml --event push --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN" ] && gh run watch "$RUN" --exit-status --interval 30 >/dev/null; then
            echo "build.yml run $RUN passed on $GITHUB_SHA; skipping the test suites"
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "no passing build.yml push run for $GITHUB_SHA; testing here"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      skip_tests: ${{ needs.check.outputs.built == 'true' }}
    # A called workflow gets no more than this. build.yml's purge_caches asks
    # for actions: write, and GitHub rejects the whole run if it is not
    # granted here, even though that job only runs on pushes to main.
    permissions:
      actions: write
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: '{linux,macos,windows}-*'
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ls -l dist
          for f in dist/*; do
            case "${f##*/}" in
              (*_"$VER"_*) ;;
              (*) echo "::error::$f is not a $VER artifact"; exit 1 ;;
            esac
          done
          uv run --no-project scripts/release-meta.py notes "$VER" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
            gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          fi
