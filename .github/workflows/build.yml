# Release packages for every platform, built, smoked, and tested the same way
# on each OS's own runner. Every job runs the same three commands:
#   sh scripts/package.sh --out out      build this host's packages
#   python e2e/package-smoke.py out      install them, compile through the
#                                        installed engine, check the first
#                                        launch
#   npm run check:platform               path tests, clippy, cargo test (lint,
#                                        format, types and vitest run once, in
#                                        the precommit and fast_check jobs)
# Only toolchain setup differs per OS. Pins live in rust-toolchain.toml and
# .nvmrc. Linux builds on the oldest Ubuntu the packages support (24.04:
# the bundled Tectonic needs glibc 2.39), for the widest glibc baseline.
# Unsigned apart from macOS ad-hoc signing. Runs on pull requests;
# release.yml calls it and attaches the package artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding full-ci to a PR starts the full platform matrix.
    types: [opened, synchronize, reopened, labeled]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      src: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.src }}
      fixtures: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.fixtures }}
      e2e: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.e2e }}
      fixtures_files: ${{ steps.filter.outputs.fixtures_files }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: csv
          filters: |
            src:
              - 'src/**'
              - 'src-tauri/**'
              - 'embed-runtime/**'
              - 'scripts/**'
              - 'e2e/**/*.py'
              - '.github/workflows/**'
            # What can differ by platform: the app and engine builds, packaging,
            # the install smoke, the toolchain pins, and the TS path layer.
            platform:
              - 'src-tauri/**'
              - 'scripts/package.sh'
              - 'scripts/build-engine.sh'
              - 'scripts/engine-key.sh'
              - 'scripts/vcpkg-ports.txt'
              - 'scripts/linux-deps.txt'
              - 'e2e/package-smoke.py'
              - 'src/lib/paths.ts'
              - 'src/lib/fs-provider*'
              - 'rust-toolchain.toml'
              - 'package-lock.json'
              - '.github/workflows/**'
            fixtures:
              - 'e2e/fixtures/**'
              - 'examples/**'
              - 'e2e/papers-run.py'
              - 'e2e/mcp_client.py'
            # The interactive-papers suites: everything src covers, plus the
            # suites themselves, their fixture and the browser driver's pin.
            e2e:
              - 'src/**'
              - 'src-tauri/**'
              - 'embed-runtime/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'

      # Pull requests get the Linux package job always, and macOS and Windows
      # only when the PR touches a platform-sensitive path or carries the
      # full-ci label. Pushes to main, releases and the like get all four.
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ steps.filter.outputs.platform }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          m='{"runner":"ubuntu-24.04","artifact":"linux-x86_64"}'
          if [ "$EVENT" != pull_request ] || [ "$PLATFORM" = true ] || [ "$LABELED" = true ]; then
            m="$m"',{"runner":"macos-15","artifact":"macos-aarch64"},{"runner":"macos-15-intel","artifact":"macos-x86_64"},{"runner":"windows-2025","artifact":"windows-x86_64"}'
          fi
          echo "matrix={\"include\":[$m]}" >> "$GITHUB_OUTPUT"

  # Every pre-commit hook except clippy (heavy; the package jobs run it in
  # npm run check), as the first and cheapest gate: the other jobs wait for
  # it. Formatters rewrite files, so a hook that changes anything fails here.
  precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: npm cache dir
        id: npm-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: npm cache save
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Rust toolchain (rustfmt, from rust-toolchain.toml)
        run: rustup toolchain install
      # A version written into the app or docs goes stale at the next bump.
      - name: No hardcoded versions
        run: uv run --no-project scripts/release-meta.py stale
      - name: Pre-commit environments cache
        id: pc-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Hooks (all files)
        # gitleaks scans staged changes, which CI has none of; it runs below
        # over the pushed commits instead.
        env:
          SKIP: gitleaks,cargo-clippy
        run: uvx pre-commit@4.6.1 run --all-files --show-diff-on-failure
      - name: Pre-commit environments cache save
        if: github.ref == 'refs/heads/main' && steps.pc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Secrets (gitleaks, pushed commits)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          case "$RANGE" in
            0000000*|..*) RANGE="HEAD~1..HEAD" ;;
          esac
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact -v --log-opts "$RANGE"
      - name: Commit messages (no ai attribution)
        if: github.event_name == 'pull_request'
        run: |
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            uvx pre-commit@4.6.1 run no-ai-attribution --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/msg" || { echo "bad message in $sha"; exit 1; }
          done

  package:
    needs: [changes, precommit]
    if: needs.changes.outputs.src == 'true'
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    # Full LTO costs minutes per OS, so only v* tags (releases) pay for it.
    # package.sh reads this, and the rust cache is keyed on it: the two modes
    # rebuild every dependency, so they cannot share a cache.
    env:
      MALEFICIUM_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'full' || 'thin' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchains: the only per-OS part.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a scripts/linux-deps.txt sudo apt-get install -y --no-install-recommends
      # The engine links ICU, freetype, graphite2, libpng and fontconfig (found
      # through pkg-config; build-engine.sh adds the keg-only icu4c). Static
      # linking is still open.
      - name: macOS engine libraries
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config icu4c graphite2 freetype libpng fontconfig harfbuzz
      # Windows: the engine's C libraries come from vcpkg, statically linked
      # (tectonic's TECTONIC_DEP_BACKEND=vcpkg; latexml's libxml2 and libxslt
      # find the same triplet through VCPKGRS_TRIPLET). The triplet links the
      # C runtime statically too, matching the engine's +crt-static
      # (src-tauri/engine/.cargo/config.toml), so no VC++ runtime is needed.
      # The installed tree is cached: a cold vcpkg build of ICU is slow.
      - name: Windows engine libraries (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: x64-windows-static
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "TECTONIC_DEP_BACKEND=vcpkg" >> $env:GITHUB_ENV
      - name: Windows vcpkg cache
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-x64-windows-static-engine-v3-${{ hashFiles('scripts/vcpkg-ports.txt') }}
          restore-keys: vcpkg-x64-windows-static-engine-v3-
      - name: Windows vcpkg install
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $t = "x64-windows-static"
          $ports = Get-Content scripts/vcpkg-ports.txt | Where-Object { $_ } | ForEach-Object { "${_}:$t" }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install @ports
      - name: Windows vcpkg cache save
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-x64-windows-static-engine-v3-${{ hashFiles('scripts/vcpkg-ports.txt') }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm cache dir
        id: npm-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The engine is its own workspace with its own (nightly) pin.
      - name: Engine toolchain (src-tauri/engine/rust-toolchain.toml)
        working-directory: src-tauri/engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine
          key: lto-${{ env.MALEFICIUM_LTO }}
          # Main seeds caches every PR reads; PR runs never write their own sets.
          # Only main saves, so tag builds (full LTO) always build cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: npm cache save
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # latexml's format dumps come from the pinned bundle over the network
      # (about two minutes). They belong to one latexml version and one
      # bundle pin, so the cache is keyed on exactly that pair
      # (scripts/dumps-key.sh); build-engine.sh skips generation on a hit.
      # Both steps are UNVERIFIED on macOS and Windows until CI runs.
      - name: Format dumps key
        id: dumps-key
        run: echo "key=dumps-${{ runner.os }}-$(sh scripts/dumps-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Format dumps cache
        id: dumps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/resources/dumps
          key: ${{ steps.dumps-key.outputs.key }}
      # The built engine, keyed on its sources, the runner image and the
      # vcpkg ports it links (scripts/engine-key.sh); build-engine.sh skips
      # cargo when the restored binary is stamped with the current key.
      - name: Engine key
        id: engine-key
        run: echo "key=$(sh scripts/engine-key.sh)-${ImageVersion:-none}-$(cksum <scripts/vcpkg-ports.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Engine cache
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Engine
        run: sh scripts/build-engine.sh
      - name: Engine cache save
        if: github.ref == 'refs/heads/main' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Format dumps cache save
        if: github.ref == 'refs/heads/main' && steps.dumps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/resources/dumps
          key: ${{ steps.dumps-key.outputs.key }}

      # The same on every OS from here.
      - name: Package
        run: sh scripts/package.sh --out out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
      - name: Smoke the installed packages
        run: python e2e/package-smoke.py out
      # Lint, format, types and vitest run once, in precommit and fast_check;
      # here only what can differ by platform: path handling and the Rust crates.
      - name: Platform checks (path tests, clippy, cargo test)
        if: ${{ !cancelled() }}
        run: npm run check:platform

  fast_check:
    needs: [changes, precommit]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm cache dir
        id: npm-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: npm cache save
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Unit tests
        run: npx vitest run

  fixture_papers:
    needs: [changes, precommit]
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The sidecar links system libraries.
      - name: Linux system libraries
        run: sudo apt-get update && xargs -a scripts/linux-deps.txt sudo apt-get install -y --no-install-recommends
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The engine is its own workspace with its own (nightly) pin.
      - name: Engine toolchain (src-tauri/engine/rust-toolchain.toml)
        working-directory: src-tauri/engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine
          save-if: false
      # The built engine, keyed on its sources, the runner image and the
      # vcpkg ports it links (scripts/engine-key.sh); build-engine.sh skips
      # cargo when the restored binary is stamped with the current key.
      - name: Engine key
        id: engine-key
        run: echo "key=$(sh scripts/engine-key.sh)-${ImageVersion:-none}-$(cksum <scripts/vcpkg-ports.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Engine cache
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Engine
        run: sh scripts/build-engine.sh
      - name: Engine cache save
        if: github.ref == 'refs/heads/main' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Changed vendored papers and examples
        id: papers
        run: |
          FILES="${{ needs.changes.outputs.fixtures_files }}"
          ARGS=""
          for f in $(echo "$FILES" | tr ',' ' '); do
            case "$f" in
              e2e/fixtures/vendored/*/* | examples/*/*)
                case "$f" in
                  examples/*) paper=$(echo "$f" | cut -d/ -f2) ;;
                  *) paper=$(echo "$f" | cut -d/ -f4) ;;
                esac
                case " $ARGS " in
                  *" --paper $paper "*) ;;
                  *) ARGS="$ARGS --paper $paper" ;;
                esac
                ;;
            esac
          done
          echo "papers:$ARGS"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Papers run (changed fixtures)
        run: python3 e2e/papers-run.py --brief ${{ steps.papers.outputs.args }}

  # The interactive-papers suites (e2e/README.md): paper export with the
  # reader in Chromium, Firefox and WebKit, the interactive package, headless
  # widget posters under Xvfb, and html widget approval. Linux only, in a
  # debug build (the poster run needs the debug-only hanging runtime).
  # scripts/ci-e2e.sh runs them the same way locally.
  e2e:
    needs: [changes, precommit]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # No debug info: the debug build is only run, and it is large.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine, a debug app build and three browsers outgrow the
      # runner's free disk; drop toolchains this job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      # Xvfb for the virtual displays, Mesa's software GL for the posters
      # WebKitGTK renders (only recommended by it), and mutool for the
      # interactive run's table row check.
      - name: Linux build packages
        run: |
          sudo apt-get update
          xargs -a scripts/linux-deps.txt sudo apt-get install -y --no-install-recommends
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mupdf-tools
      # Ubuntu 24.04's AppArmor denies unprivileged user namespaces, so the
      # export run's offline cells (unshare -rn) would print skip:.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python packages
        run: python -m pip install jsonschema
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Engine toolchain (src-tauri/engine/rust-toolchain.toml)
        working-directory: src-tauri/engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Format dumps key
        id: dumps-key
        run: echo "key=dumps-${{ runner.os }}-$(sh scripts/dumps-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Format dumps cache
        id: dumps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/resources/dumps
          key: ${{ steps.dumps-key.outputs.key }}
      # Before any cargo build: tauri-build copies this engine into
      # target/debug, and ci-e2e.sh checks the copy matches.
      # The built engine, keyed on its sources, the runner image and the
      # vcpkg ports it links (scripts/engine-key.sh); build-engine.sh skips
      # cargo when the restored binary is stamped with the current key.
      - name: Engine key
        id: engine-key
        run: echo "key=$(sh scripts/engine-key.sh)-${ImageVersion:-none}-$(cksum <scripts/vcpkg-ports.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Engine cache
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Engine
        run: sh scripts/build-engine.sh
      - name: Engine cache save
        if: github.ref == 'refs/heads/main' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/binaries
          key: engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine-key.outputs.key }}
      - name: Format dumps cache save
        if: github.ref == 'refs/heads/main' && steps.dumps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/resources/dumps
          key: ${{ steps.dumps-key.outputs.key }}
      # The browsers belong to the playwright-core version in the lockfile.
      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Playwright browsers and their system libraries
        run: npx playwright-core install --with-deps chromium firefox webkit
      - name: Playwright browsers cache save
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The TeX bundle the suites compile against, fetched on first use and
      # content-addressed by the pinned digest.
      - name: TeX bundle key
        id: bundle-key
        run: |
          d=$(sed -n 's/^pub const BUNDLE_DIGEST: &str = "\([0-9a-f]*\)";/\1/p' src-tauri/core/src/engine.rs)
          [ -n "$d" ] || { echo "BUNDLE_DIGEST not found in src-tauri/core/src/engine.rs"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - name: TeX bundle cache
        id: tex-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/io.github.wahahayes.maleficium/maleficium-tectonic/${{ steps.bundle-key.outputs.digest }}
          key: tex-bundle-${{ steps.bundle-key.outputs.digest }}
      - name: Interactive-papers suites
        env:
          CI_E2E_LOGS: ${{ runner.temp }}/e2e-logs
        run: sh scripts/ci-e2e.sh
      - name: TeX bundle cache save
        if: github.ref == 'refs/heads/main' && steps.tex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/io.github.wahahayes.maleficium/maleficium-tectonic/${{ steps.bundle-key.outputs.digest }}
          key: tex-bundle-${{ steps.bundle-key.outputs.digest }}
      - name: Upload suite logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e-logs/*.log
          if-no-files-found: ignore

  purge_caches:
    runs-on: ubuntu-24.04
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prune old caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --limit 100 || true
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes 2>/dev/null || echo 0)
          echo "cache use: $((used / 1048576)) MiB of 10240 MiB"
          if [ "$used" -gt 7516192768 ]; then echo "::warning::repo cache use is above 7 GiB (cap is 10 GiB)"; fi
          # Keep main's seeded caches; prune everything else.
          gh cache list --json id,ref --limit 100 --jq '.[] | select(.ref != "refs/heads/main") | .id' 2>/dev/null | while read -r id; do
            [ -n "$id" ] && gh cache delete "$id" || true
          done

  ci:
    runs-on: ubuntu-24.04
    needs: [changes, precommit, package, fast_check, e2e, fixture_papers, purge_caches]
    if: always()
    steps:
      - name: Gate on source and fixture changes
        run: |
          SRC="${{ needs.changes.outputs.src }}"
          E2E="${{ needs.changes.outputs.e2e }}"
          FIX="${{ needs.changes.outputs.fixtures }}"
          PURGE="${{ needs.purge_caches.result }}"
          FAIL=0
          echo "precommit: ${{ needs.precommit.result }}"
          if [ "${{ needs.precommit.result }}" != "success" ]; then FAIL=1; fi
          if [ "$SRC" != "true" ] && [ "$E2E" != "true" ] && [ "$FIX" != "true" ]; then
            echo "No source or fixture changes; CI passes by skip."
            exit $FAIL
          fi
          if [ "$SRC" = "true" ]; then
            echo "package: ${{ needs.package.result }} fast_check: ${{ needs.fast_check.result }}"
            if [ "${{ needs.package.result }}" = "cancelled" ]; then echo "package was cancelled: a job hit its timeout-minutes, not a test failure"; fi
            if [ "${{ needs.package.result }}" != "success" ]; then FAIL=1; fi
            if [ "${{ needs.fast_check.result }}" != "success" ]; then FAIL=1; fi
          fi
          if [ "$E2E" = "true" ]; then
            echo "e2e: ${{ needs.e2e.result }}"
            if [ "${{ needs.e2e.result }}" != "success" ]; then FAIL=1; fi
          fi
          if [ "$FIX" = "true" ]; then
            echo "fixture_papers: ${{ needs.fixture_papers.result }}"
            if [ "${{ needs.fixture_papers.result }}" != "success" ]; then FAIL=1; fi
          fi
          if [ "$PURGE" != "skipped" ] && [ "$PURGE" != "success" ]; then
            echo "purge_caches: $PURGE"
            FAIL=1
          fi
          exit $FAIL
