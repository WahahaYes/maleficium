# Release packages for every platform, built, smoked, and tested the same way
# on each OS's own runner. Every job runs the same three commands:
#   sh scripts/package.sh --out out      build this host's packages
#   python e2e/package-smoke.py out      install them, compile through the
#                                        installed engine, check the first
#                                        launch, screenshot it
#   npm run check                        lint, format, types, every test suite
# Only toolchain setup differs per OS. Pins live in rust-toolchain.toml and
# .nvmrc. Linux builds on the oldest Ubuntu the packages support (24.04:
# the bundled Tectonic needs glibc 2.39), for the widest glibc baseline.
# Unsigned apart from macOS ad-hoc signing. Runs on pull requests;
# release.yml calls it and attaches the package artifacts.
name: build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, artifact: linux-x86_64 }
          - { runner: macos-15, artifact: macos-aarch64 }
          - { runner: macos-15-intel, artifact: macos-x86_64 }
          - { runner: windows-2025, artifact: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchains: the only per-OS part.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a scripts/linux-deps.txt sudo apt-get install -y --no-install-recommends
      # The engine links ICU, freetype, graphite2, libpng and fontconfig (found
      # through pkg-config); icu4c is keg-only. Static linking is still open.
      - name: macOS engine libraries
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config icu4c graphite2 freetype libpng fontconfig harfbuzz
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      # Windows: the engine's C libraries come from vcpkg, statically linked
      # (tectonic's TECTONIC_DEP_BACKEND=vcpkg; latexml's libxml2 and libxslt
      # find the same triplet through VCPKGRS_TRIPLET). The installed tree is
      # cached: a cold vcpkg build of ICU is slow.
      - name: Windows engine libraries (vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: x64-windows-static-md
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" >> $env:GITHUB_ENV
          "TECTONIC_DEP_BACKEND=vcpkg" >> $env:GITHUB_ENV
      - name: Windows vcpkg cache
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}\installed
          key: vcpkg-x64-windows-static-md-engine-v1
      - name: Windows vcpkg install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = "x64-windows-static-md"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install `
            "freetype:$t" "graphite2:$t" "harfbuzz[graphite2]:$t" "icu:$t" `
            "libpng:$t" "fontconfig:$t" "libxml2:$t" "libxslt:$t"
      # SyncTeX builds under MINGW64 (gcc + static zlib); the app itself
      # builds with the runner's MSVC toolchain.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: >-
            curl git python tar mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # A version written into the app or docs goes stale at the next bump.
      - name: No hardcoded versions
        run: python scripts/release-meta.py stale
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # The engine is its own workspace with its own (nightly) pin.
      - name: Engine toolchain (src-tauri/engine/rust-toolchain.toml)
        working-directory: src-tauri/engine
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/engine
      - run: npm ci
      - name: Sidecars
        if: runner.os != 'Windows'
        run: sh scripts/fetch-sidecars.sh
      - name: Sidecars
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: sh scripts/fetch-sidecars.sh

      # The same on every OS from here.
      - name: Package
        run: sh scripts/package.sh --out out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
      - name: Smoke the installed packages
        run: python e2e/package-smoke.py out --shots "$RUNNER_TEMP/shots"
      - name: Upload launch screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-${{ matrix.artifact }}
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
      - name: Check (lint, format, types, tests)
        if: ${{ !cancelled() }}
        run: npm run check
