# Release artifacts for every platform: Linux .deb + AppImage (the same
# Dockerfile release.sh uses), macOS .dmg for Apple silicon and Intel, and a
# Windows NSIS installer. Unsigned apart from macOS ad-hoc signing. Runs on
# pull requests so a PR proves all three build; release.yml calls it.
# Each job then installs what it built the way a user would, compiles a page
# through the installed maleficium-mcp (e2e/mcp-compile-smoke.py), checks the
# app stays up, and runs the Rust and vitest suites on that OS.
name: build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Match the Dockerfile's pins.
  NODE_VERSION: 22.23.2
  RUST_VERSION: 1.98.1

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build .deb and AppImage in Docker
        run: docker build --output type=local,dest=out .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: out/*
          if-no-files-found: error
      - name: Smoke the .deb and AppImage
        run: sh e2e/release-smoke.sh out 20

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Sidecars (Tectonic, host-built SyncTeX)
        run: sh scripts/fetch-sidecars.sh
      - name: Build .dmg
        run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Smoke the installed .dmg
        run: |
          set -eu
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" src-tauri/target/release/bundle/dmg/*.dmg
          cp -R "$mnt/Maleficium.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/Maleficium.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bin="$app/Contents/MacOS"
          ls -l "$bin"
          for b in maleficium-mcp maleficium-tectonic maleficium-synctex; do
            [ -x "$bin/$b" ] || { echo "smoke: FAIL bundle is missing $b"; exit 1; }
            lipo -archs "$bin/$b" | grep -qw "${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}" \
              || { echo "smoke: FAIL $b is $(lipo -archs "$bin/$b")"; exit 1; }
          done
          python3 e2e/mcp-compile-smoke.py "$bin/maleficium-mcp" "$RUNNER_TEMP/doc"
          main=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$bin/$main" >"$RUNNER_TEMP/launch.log" 2>&1 & pid=$!
          sleep 20
          kill -0 "$pid" || { echo "smoke: FAIL app exited early"; cat "$RUNNER_TEMP/launch.log"; exit 1; }
          kill "$pid"
          echo "smoke: launch ok (alive 20s)"
      - name: Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      - name: Frontend tests
        run: npm test

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SyncTeX builds under MINGW64 (gcc + static zlib); the app itself
      # builds with the runner's MSVC toolchain.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            curl git python tar mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
      - name: Sidecars (Tectonic, host-built SyncTeX)
        shell: msys2 {0}
        run: sh scripts/fetch-sidecars.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Smoke the installed NSIS package
        shell: pwsh
        run: |
          $setup = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)[0].FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Maleficium'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "smoke: FAIL installer exited $($p.ExitCode)" }
          Get-ChildItem $dir
          foreach ($b in 'Maleficium.exe', 'maleficium-mcp.exe', 'maleficium-tectonic.exe', 'maleficium-synctex.exe') {
            if (-not (Test-Path (Join-Path $dir $b))) { throw "smoke: FAIL install is missing $b" }
          }
          python e2e/mcp-compile-smoke.py (Join-Path $dir 'maleficium-mcp.exe') (Join-Path $env:RUNNER_TEMP 'doc')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath (Join-Path $dir 'Maleficium.exe') -PassThru
          Start-Sleep 20
          if ($app.HasExited) { throw "smoke: FAIL app exited early ($($app.ExitCode))" }
          Stop-Process -Id $app.Id
          'smoke: launch ok (alive 20s)'
      - name: Rust tests
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      - name: Frontend tests
        run: npm test
