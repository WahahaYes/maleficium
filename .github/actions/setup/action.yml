# One shared setup for the CI jobs that build or test the app: system
# libraries, Python, the Rust toolchains, npm and the engine. Each job used
# to copy these steps, drifting apart; the job keeps only what is truly its
# (vcpkg on Windows, prek hooks, playwright, the TeX bundle).
#  - system libraries: apt on Linux, Homebrew on macOS, both cached. The
#    package lists live in scripts/linux-deps.txt and scripts/macos-brew.txt;
#    a job can append more apt packages (the e2e browsers' extras).
#  - rust: dtolnay installs the pinned channels (read from the two
#    rust-toolchain.toml files, so the pins stay single-sourced) before
#    Swatinem/rust-cache, which needs the toolchains in place.
# Only main saves caches; every other ref restores what main seeded.
name: setup
description: System libraries, Python, Rust toolchains, npm and the engine
inputs:
  with-system-deps:
    description: Install OS system libraries (apt on Linux, Homebrew on macOS; Windows uses the job's own vcpkg steps)
    default: 'true'
  extra-apt-packages:
    description: Additional apt packages beyond scripts/linux-deps.txt, space-separated
    default: ''
  with-python:
    description: Set up CPython 3.12
    default: 'false'
  python-packages:
    description: Extra pip packages to install, space-separated
    default: ''
  with-npm:
    description: Set up Node and install npm dependencies (see actions/npm)
    default: 'true'
  with-engine:
    description: Restore or build the engine and format dumps (see actions/engine)
    default: 'true'
  engine-logs-dir:
    description: Directory for per-step engine build logs (CI_ENGINE_LOGS)
    default: ''
  rust-key:
    description: Additional rust-cache key, alongside the automatic job-based one (e.g. the LTO mode)
    default: ''
  rust-save:
    description: Whether rust-cache may save (pass 'true' only where main seeds the cache)
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read toolchain pins
      id: pins
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
        components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
        engine_channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' src-tauri/engine/rust-toolchain.toml)
        engine_components=$(sed -n 's/^components = \[\(.*\)\]$/\1/p' src-tauri/engine/rust-toolchain.toml | tr -d '" ')
        [ -n "$channel" ] && [ -n "$engine_channel" ] || { echo "toolchain pin not found"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$components" >> "$GITHUB_OUTPUT"
        echo "engine-channel=$engine_channel" >> "$GITHUB_OUTPUT"
        echo "engine-components=$engine_components" >> "$GITHUB_OUTPUT"
    - name: System package lists
      id: syspkgs
      if: inputs.with-system-deps == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          pkgs=$(xargs < scripts/linux-deps.txt)
          pkgs="$pkgs ${{ inputs.extra-apt-packages }}"
        else
          pkgs=$(xargs < scripts/macos-brew.txt)
        fi
        echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
    - name: Linux system libraries
      if: inputs.with-system-deps == 'true' && runner.os == 'Linux'
      uses: gerlero/apt-install@c0fa73fe5c4a22deecf6d629565be92a15dd2026 # v1.3.12
      with:
        packages: ${{ steps.syspkgs.outputs.packages }}
        cache: 'true'
        update: 'true'
        upgrade: 'false'
        install-recommends: 'false'
    - name: macOS engine libraries
      if: inputs.with-system-deps == 'true' && runner.os == 'macOS'
      uses: gerlero/brew-install@f21af2da1f07ad75501992d36996ddb7afe0cedb # v1.1.6
      with:
        packages: ${{ steps.syspkgs.outputs.packages }}
        cache: 'true'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      if: inputs.with-python == 'true'
      with:
        python-version: '3.12'
    - name: Python packages
      if: inputs.with-python == 'true' && inputs.python-packages != ''
      shell: bash
      run: python -m pip install ${{ inputs.python-packages }}
    - name: Rust toolchain (rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.pins.outputs.channel }}
        components: ${{ steps.pins.outputs.components }}
    - name: Engine toolchain (src-tauri/engine/rust-toolchain.toml)
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: ${{ steps.pins.outputs.engine-channel }}
        components: ${{ steps.pins.outputs.engine-components }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: |
          src-tauri
          src-tauri/engine
        key: ${{ inputs.rust-key }}
        save-if: ${{ inputs.rust-save }}
    - uses: ./.github/actions/npm
      if: inputs.with-npm == 'true'
    - uses: ./.github/actions/engine
      if: inputs.with-engine == 'true'
      env:
        CI_ENGINE_LOGS: ${{ inputs.engine-logs-dir }}
