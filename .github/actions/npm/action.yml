# Node from .nvmrc, the npm cache, and npm ci. Only main saves the cache; PR runs
# restore it (see the engine action).
name: npm
description: Set up Node and install npm dependencies with a cache
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - name: npm cache dir
      id: npm-dir
      shell: bash
      run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - name: npm cache
      id: npm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-dir.outputs.dir }}
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - run: npm ci
      shell: bash
    - name: npm cache save
      if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-dir.outputs.dir }}
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
