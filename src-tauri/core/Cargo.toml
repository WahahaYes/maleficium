[package]
name = "maleficium-core"
version.workspace = true
license = "AGPL-3.0-only"
edition = "2021"
description = "Application core shared by the desktop app and the MCP server: no Tauri"

[features]
# Scratch dirs for tests in dependent crates.
test-support = ["dep:libc"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
schemars = "1.2.2"
ts-rs = "12.0.1"
dirs = "6.0.0"
dunce = "1.0.5"
sha2 = "0.10.9"
libc = { version = "0.2.189", optional = true }
maleficium-structure = { path = "../structure" }
maleficium-events = { path = "../events" }
maleficium-index = { path = "../index" }
# Base64 previews over the JSON contract (bytes have no JSON shape).
base64 = "0.22.1"
# Poster snapshots are decoded to check they are sane, non-blank and
# theme-responsive; only decoding is used, never encoding.
png = "0.18.1"
# Renders pdf pages for snippets. No embedded fonts: Tectonic embeds every font.
hayro = { version = "0.7", default-features = false }
# The core-owned file watcher (notify thread per session root). No Tauri.
notify = "8"
jsonschema = { version = "0.58", default-features = false }
# The reader's sanitizer and article post-processing parse HTML with
# html5ever through this DOM (already in the tree via tauri-utils).
dom_query = { version = "0.27", default-features = false }

[dev-dependencies]
libc = "0.2.189"
