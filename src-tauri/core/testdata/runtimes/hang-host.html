<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      addEventListener('message', function (e) {
        if (e.source === parent && e.data && e.data.type === 'init') {
          for (;;) {}
        }
      });
      parent.postMessage({ mfw: 1, type: 'ready' }, '*');
    </script>
  </body>
</html>
