[package]
name = "maleficium-engine"
version = "0.3.0"
license = "AGPL-3.0-only"
description = "The compile and convert engines, run as a child of the app"
authors = ["Ethan Wilson"]
edition = "2021"

# Not a member of ../Cargo.toml: it has its own toolchain pin and lockfile.
[workspace]

[[bin]]
name = "maleficium-engine"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
# Static zlib for the SyncTeX parser, so no system zlib is needed.
libz-sys = { version = "1", default-features = false, features = ["static"] }
tectonic = "=0.17.0"
tectonic_bridge_core = "=0.5.3"
tectonic_bundles = "=0.4.2"
tectonic_errors = "=0.3.0"
tectonic_io_base = "=0.6.0"
tectonic_status_base = "=0.2.2"
latexml = "=0.7.6"
# The pieces `latexml::api::convert_to_html` is built from, driven directly
# so the conversion log and status survive. Versions are the ones latexml pins.
latexml_core = "=0.6.0"
latexml_package = "=0.7.0"
latexml_contrib = "=0.5.0"
latexml_post = "=0.5.0"
