[package]
name = "maleficium-index"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"
description = "Project index: every file's text and symbols, cross-file maps, search (pure, no I/O, wasm32-ready)"

[dependencies]
maleficium-structure = { path = "../structure" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
ts-rs = "12.0.1"

[dev-dependencies]
serde_json = "1.0.151"
