[package]
name = "maleficium-widget-host"
version.workspace = true
license = "Apache-2.0"
edition = "2021"
description = "The widget host port: helper protocol, bridge validation, watchdog, live-widget policy and conformance suite. No Tauri, no GUI toolkit"

[features]
# The shared conformance suite, for platform implementations' own tests.
conformance = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
