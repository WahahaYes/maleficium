[package]
name = "maleficium-widget-helper"
version.workspace = true
license = "Apache-2.0"
edition = "2021"
description = "One widget in its own process: a sandboxed WebKitGTK view embedded in the editor's X11 window, driven over the widget host protocol. No Tauri"

[[bin]]
name = "maleficium-widget-helper"
path = "src/main.rs"

[dependencies]
maleficium-widget-host = { path = "../widget-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.22.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
gdk = "0.18.2"
gdkx11 = "0.18.2"
glib = "0.18.5"
gio = "0.18.4"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
soup3 = "0.5.0"
javascriptcore-rs = "1.1.2"
x11 = { version = "2.21.0", features = ["xlib"] }
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dev-dependencies]
maleficium-widget-host = { path = "../widget-host", features = ["conformance"] }
x11 = { version = "2.21.0", features = ["xlib", "xtest"] }
