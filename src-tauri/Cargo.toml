[package]
name = "maleficium"
version = "0.1.1"
license = "Apache-2.0"
description = "Desktop-native LaTeX editor"
authors = ["Ethan Wilson"]
edition = "2021"
default-run = "maleficium"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["structure", "events", "index"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maleficium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-fs = { version = "2.5.2", features = ["watch"] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rmcp = { version = "3.4.0", features = ["server", "transport-io"] }
tokio = { version = "1.53.1", features = ["full"] }
schemars = "1.2.2"
anyhow = "1.0.104"
dirs = "6.0.0"
dunce = "1.0.5"
sha2 = "0.10.9"
maleficium-structure = { path = "structure" }
maleficium-events = { path = "events" }
maleficium-index = { path = "index" }

[dev-dependencies]
libc = "0.2.189"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
