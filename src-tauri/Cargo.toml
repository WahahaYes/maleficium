[package]
name = "maleficium"
version.workspace = true
license = "AGPL-3.0-only"
description = "Desktop-native LaTeX editor"
authors = ["Ethan Wilson"]
repository = "https://github.com/WahahaYes/maleficium"
homepage = "https://github.com/WahahaYes/maleficium"
edition = "2021"
default-run = "maleficium"

[workspace]
members = ["core", "mcp", "structure", "events", "index"]

# The app version; the MCP server reports it too.
[workspace.package]
version = "0.3.0"

[lib]
# Distinct from the bin name: on Windows a shared name collides
# (https://github.com/rust-lang/cargo/issues/8519).
name = "maleficium_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-fs = { version = "2.5.2" }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
dunce = "1.0.5"
maleficium-core = { path = "core" }
maleficium-mcp = { path = "mcp" }
maleficium-structure = { path = "structure" }
maleficium-events = { path = "events" }
maleficium-index = { path = "index" }
open = "5.4.4"

# The poster renderer kills a render window's web process on timeout.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[dev-dependencies]
maleficium-core = { path = "core", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
