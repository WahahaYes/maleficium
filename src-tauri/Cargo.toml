[package]
name = "maleficium"
version.workspace = true
license = "Apache-2.0"
description = "Desktop-native LaTeX editor"
authors = ["Ethan Wilson"]
edition = "2021"
default-run = "maleficium"

[workspace]
members = ["core", "mcp", "structure", "events", "index", "widget-host", "widget-helper"]

# The app version; the MCP server reports it too.
[workspace.package]
version = "0.3.0"

[lib]
# Distinct from the bin name: on Windows a shared name collides
# (https://github.com/rust-lang/cargo/issues/8519).
name = "maleficium_lib"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = "2.11.5"
tauri-plugin-fs = { version = "2.5.2" }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
dunce = "1.0.5"
maleficium-core = { path = "core" }
maleficium-mcp = { path = "mcp" }
maleficium-structure = { path = "structure" }
maleficium-events = { path = "events" }
maleficium-index = { path = "index" }
maleficium-widget-host = { path = "widget-host" }
maleficium-widget-helper = { path = "widget-helper" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
gdkx11 = "0.18.2"
x11 = { version = "2.21.0", features = ["xlib"] }

[dev-dependencies]
maleficium-core = { path = "core", features = ["test-support"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
