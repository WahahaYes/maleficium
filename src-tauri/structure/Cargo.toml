[package]
name = "maleficium-structure"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Document structure of LaTeX text: pure, no I/O, no Tauri (wasm32-ready)"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.2"
ts-rs = "12.0.1"

[dev-dependencies]
serde_json = "1.0.151"
