default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^(src-tauri/(tauri\.conf\.json|capabilities/|gen/|target/)|tsconfig\.json)$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
        exclude: ^src-tauri/binaries/
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^src-tauri/binaries/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
  - repo: local
    # Non-login shells (IDEs, agents) often lack ~/.cargo/bin on PATH.
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo fmt --manifest-path src-tauri/Cargo.toml -- --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy warnings
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: tsc-noemit
        name: tsc --noEmit
        entry: ./node_modules/.bin/tsc --noEmit --skipLibCheck
        language: system
        types: [ts]
        pass_filenames: false
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: ./node_modules/.bin/eslint .
        language: system
        types: [ts]
        pass_filenames: false
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier --check
        entry: ./node_modules/.bin/prettier --check .
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no co-author or ai attribution in commit messages
        entry: '(co-authored-by:|noreply@anthropic\.com|generated with .*claude|claude code)'
        language: pygrep
        args: [-i]
        stages: [commit-msg]
