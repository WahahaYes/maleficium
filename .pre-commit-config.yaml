default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^(src-tauri/(tauri\.conf\.json|capabilities/|gen/|target/)|tsconfig\.json)$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
        # Fetched engine sidecars stay out of the size check.
        exclude: ^(src-tauri/binaries/)
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^src-tauri/binaries/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
  # Formatters fix what they can: a hook that rewrites a file fails the
  # commit, and re-staging the fixed file lets it through. npm run check
  # and CI stay check-only.
  - repo: local
    # Non-login shells (IDEs, agents) often lack ~/.cargo/bin on PATH.
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        # --all: without it only the app crate is formatted, not the
        # structure, events and index workspace crates.
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo fmt --all --manifest-path src-tauri/Cargo.toml'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy warnings
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH" exec cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: tsc-noemit
        name: tsc --noEmit
        entry: ./node_modules/.bin/tsc --noEmit --skipLibCheck
        language: system
        types: [ts]
        pass_filenames: false
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix
        entry: ./node_modules/.bin/eslint --fix
        language: system
        files: \.(ts|tsx|js|mjs|cjs)$
  - repo: local
    hooks:
      - id: prettier
        name: prettier --write
        # Staged files only; .prettierignore still applies to named paths.
        entry: ./node_modules/.bin/prettier --write --ignore-unknown
        language: system
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no co-author or ai attribution in commit messages
        entry: '(co-authored-by:|noreply@anthropic\.com|generated with .*claude|claude code)'
        language: pygrep
        args: [-i]
        stages: [commit-msg]
