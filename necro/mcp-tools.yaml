rules:
  mcp-hints-explicit:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      lines = open(p).readlines()
      ends = [i for i, l in enumerate(lines) if re.match(r"\s*\)\]\s*$", l)]
      starts = [i for i, l in enumerate(lines) if l.lstrip().startswith("#[tool(")]
      assert len(starts) == 38, f"expected 38 #[tool( blocks, found {len(starts)}"
      tools = {}
      for s in starts:
          e = min(x for x in ends if x > s)
          k = e + 1
          while not re.match(r"\s*fn (\w+)", lines[k]):
              k += 1
          tools[re.match(r"\s*fn (\w+)", lines[k]).group(1)] = (s + 1, "".join(lines[s:e + 1]))
      for name, (line, block) in sorted(tools.items()):
          for h in ["read_only_hint", "destructive_hint", "idempotent_hint", "open_world_hint"]:
              if h not in block:
                  print(f"{p}:{line}: tool `{name}` lacks {h}")
      def hv(name, hint):
          m = re.search(hint + r"\s*=\s*(true|false)", tools[name][1])
          return m.group(1) == "true"
      pins = {"search": (True, False), "replace": (False, True), "export_read": (True, False), "export_write": (False, True)}
      for name, (ro, destr) in pins.items():
          if (hv(name, "read_only_hint"), hv(name, "destructive_hint")) != (ro, destr):
              print(f"{p}:{tools[name][0]}: tool `{name}` honesty drifted: want read_only={str(ro).lower()} destructive={str(destr).lower()}")
      ow = sorted(n for n in tools if hv(n, "open_world_hint"))
      if ow != ["compile_run"]:
          print(f"{p}:1: open-world tools are {ow}, want only [compile_run]")
      for name in ["widgets_status", "widget_check"]:
          if not (hv(name, "read_only_hint") and not hv(name, "open_world_hint")):
              print(f"{p}:{tools[name][0]}: tool `{name}` must stay read-only and closed-world")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: an MCP tool without explicit worst-case-honest hints
    why: >-
      every registered tool carries all four annotation hints explicitly, so a new tool without them fails here instead of in a rescan (twin every_tool_carries_all_four_hints at src-tauri/mcp/src/lib.rs:3115). Worst-case honesty is pinned where the regroup decided it: search and export_read read, replace and export_write destroy, and only compile_run (the fetcher) is open-world; widgets_status and widget_check stay read-only and closed-world (twins at src-tauri/mcp/src/lib.rs:2375,2837).
    fix: >-
      name all four hints on the #[tool] attribute with the effect the worst action can have, and keep network use on compile_run alone.

  mcp-covered-list-sync:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      src = open(p).read()
      routed = sorted(set(re.findall(r"self\.tool(?:_async)?\(\"([a-z_]+)\"", src)))
      m = re.search(r"let covered = \[(.*?)\];", src, re.S)
      covered = sorted(re.findall(r"\"([a-z_]+)\"", m.group(1)))
      if routed != covered:
          only_tool = [t for t in routed if t not in covered]
          only_list = [t for t in covered if t not in routed]
          print(f"{p}:3633: router/list drift: unlisted {only_tool}, unrouted {only_list}")
      if len(routed) != 38:
          print(f"{p}:3979: router carries {len(routed)} tools, want 38 (the search/replace + export split landing)")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: the registered-tool coverage list drifted from the router
    why: >-
      every_registered_tool_has_a_case_and_runs (src-tauri/mcp/src/lib.rs:3147) enumerates its covered list (src-tauri/mcp/src/lib.rs:3633) and fails on any tool without a case, while grouped_tools_stay_under_token_budget (src-tauri/mcp/src/lib.rs:3977) pins the count at 38 after the search/replace and export splits.
    fix: >-
      register the tool once, add its case beside the others, and keep the count at 38 (or move the pin deliberately with the twins).

  mcp-no-approval-words:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      src = open(p).read()
      banned = ["approv", "revok", "auto", "mode", "trust", "allow"]
      def bad(name):
          n = name.lower()
          return [b for b in banned if b in n]
      for t in sorted(set(re.findall(r"self\.tool(?:_async)?\(\"([a-z_]+)\"", src))):
          if bad(t):
              print(f"{p}:1: tool `{t}` names an approval word {bad(t)}")
      for m in re.finditer(r"struct (\w*Params) \{(.*?)\n\}", src, re.S):
          for f in re.findall(r"^    (\w+):", m.group(2), re.M):
              if bad(f):
                  print(f"{p}:1: `{m.group(1)}` takes `{f}`, an approval word {bad(f)}")
      for m in re.finditer(r"enum (\w*Action) \{(.*?)\n\}", src, re.S):
          for v in re.findall(r"^    ([A-Z]\w*),?\s*$", m.group(2), re.M):
              if bad(v):
                  print(f"{p}:1: `{m.group(1)}` has action `{v}`, an approval word {bad(v)}")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: an approval word in a tool, parameter or action name
    why: >-
      no tool is named for approval and no tool takes a parameter for it (twin no_tool_can_approve_revoke_or_change_auto_approval at src-tauri/mcp/src/lib.rs:2837 checks tool names, param names, widget params and the core Request enum at src-tauri/core/src/api.rs:717). The regroup names (search, replace, export_read, export_write with actions search|find_files, preview|apply|undo, stamp|status|cancel, pdf|zip|bundle|preview|open) contain none of approv|revok|auto|mode|trust|allow; keep it that way.
    fix: >-
      rename the tool, parameter or action so it says what it does, not what it permits.

  mcp-no-core-approve-call:
    command: necro grep 'widget_approval::(approve|revoke|set_auto|decide_runtime|review_runtime)[a-z_]*\(' -- 'src-tauri/mcp/src/lib.rs'
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: the MCP crate calls a core user-action approval function
    why: >-
      this crate never calls the core's user-action functions (twin at src-tauri/mcp/src/lib.rs:2837 asserts no widget_approval::{approve, approve_at, revoke, revoke_at, set_auto_approve, set_auto_at, decide_runtime, decide_runtime_at, review_runtime, review_runtime_at} call; the core twin at src-tauri/core/src/api.rs:717 keeps approve/revoke/auto out of the shared Request enum). Reads (widgets_status, review, check_runtime) stay allowed.
    fix: >-
      return approval_required as a normal result like widget_check does, and let the app's View > Widgets own the click.

  mcp-closed-schema:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      lines = open(p).readlines()
      closed = ["DocumentParams", "ExportReadParams", "ExportWriteParams", "RuntimeScaffoldParams", "RuntimeValidateParams", "RuntimeInstallParams", "WidgetsStatusParams", "WidgetCheckParams", "AppWindowsParams", "AppRequestOpenParams", "SearchParams", "ReplaceParams"]
      for i, l in enumerate(lines):
          m = re.match(r"struct (\w+)", l)
          if m and m.group(1) in closed:
              j = i - 1
              seen = False
              while j >= 0 and (lines[j].strip() == "" or lines[j].lstrip().startswith("#[") or lines[j].lstrip().startswith("///") or lines[j].lstrip().startswith("//")):
                  if "deny_unknown_fields" in lines[j]:
                      seen = True
                  j -= 1
              if not seen:
                  print(f"{p}:{i + 1}: `{m.group(1)}` lost deny_unknown_fields")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: a twin-closed MCP params struct without deny_unknown_fields
    why: >-
      the approval-adjacent and grouped params refuse unknown fields at the schema (deny_unknown_fields, which schemars renders as additionalProperties: false) and in handler checks, so an approve (or anything like it) is an error, never a silent extra (twins at src-tauri/mcp/src/lib.rs:2304,2375,2444,2654,2837,3892). These twelve structs are the closed set; other params predate the rule.
    fix: >-
      restore #[serde(deny_unknown_fields)] above the struct (and keep the per-action handler checks for fields the schema cannot see).

  mcp-ui-meta-allowlist:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      lines = open(p).readlines()
      ends = [i for i, l in enumerate(lines) if re.match(r"\s*\)\]\s*$", l)]
      starts = [i for i, l in enumerate(lines) if l.lstrip().startswith("#[tool(")]
      got = {}
      for s in starts:
          e = min(x for x in ends if x > s)
          k = e + 1
          while not re.match(r"\s*fn (\w+)", lines[k]):
              k += 1
          name = re.match(r"\s*fn (\w+)", lines[k]).group(1)
          m = re.search(r"meta = ui_meta\((.*?)\)\s*,?\s*$", "".join(lines[s:e + 1]), re.S | re.M)
          if m:
              got[name] = (s + 1, re.sub(r"\s+", "", m.group(1)))
      want = {"compile_run": None, "snippet": None, "snippet_render": None}
      for name in sorted(set(got) - set(want)):
          print(f"{p}:{got[name][0]}: `{name}` carries ui meta, want only {sorted(want)}")
      for name in sorted(set(want) - set(got)):
          print(f"{p}:2249: `{name}` lost its ui meta, want {sorted(want)}")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: a View attached to a tool outside the allowlist
    why: >-
      only the snippet tools and compile_run name a View; the re-render tool is hidden from the model, and dashboard calls (compile_poll, compile_cancel, diagnostics, offline_readiness) stay plain tools so text-only hosts see them as before (twin only_the_view_tools_carry_ui_meta at src-tauri/mcp/src/lib.rs:2249, unchanged by the regroup).
    fix: >-
      drop the meta = ui_meta line, or move the pin deliberately with the twin when a new View lands.

  mcp-trust-gated-writes:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      src = open(p).read()
      pins = ["without confirm it is refused", "apply requires `token`", "undo requires `batch`", "run runtime_validate first", "core::runtime_author::install("]
      for pin in pins:
          if pin not in src:
              print(f"{p}:1: trust gate lost: `{pin}`")
      m = re.search(r"struct DeleteParams \{(.*?)\n\}", src, re.S)
      if "confirm" not in m.group(1):
          print(f"{p}:1: DeleteParams lost its confirm field")
      m = re.search(r"struct ReplaceParams \{(.*?)\n\}", src, re.S)
      if not ("token" in m.group(1) and "batch" in m.group(1)):
          print(f"{p}:1: ReplaceParams lost its token/batch fields")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: a gated write lost its gate
    why: >-
      delete needs the absolute path back as confirm before it trashes (two calls), replace applies only by preview token and undoes only by batch, and install copies only a draft that validates (run runtime_validate first). The twins pin each gate: delete/undo in every_registered_tool_has_a_case_and_runs (src-tauri/mcp/src/lib.rs:3359), the token state machine in replace_token_flow (src-tauri/mcp/src/lib.rs:3775), install-never-approves in runtime_tools_are_library_scoped_and_cannot_approve (src-tauri/mcp/src/lib.rs:2654).
    fix: >-
      restore the two-call confirm, the token/batch threading, or the validate-before-install wording and call.

  mcp-action-enum-closed:
    command: |-
      python3 -c 'import re
      p = "src-tauri/mcp/src/lib.rs"
      src = open(p).read()
      lines = src.splitlines(keepends=True)
      for t in sorted(set(re.findall(r"self\.tool(?:_async)?\(\"([a-z_]+)\"", src))):
          if t.endswith("_schema"):
              print(f"{p}:1: per-noun `{t}` tool: fold it into the noun tool as an action")
      want_actions = {"SearchAction": ["Search", "FindFiles"], "ReplaceAction": ["Preview", "Apply", "Undo"], "ExportReadAction": ["Stamp", "Status", "Cancel"], "ExportWriteAction": ["Pdf", "Zip", "Bundle", "Preview", "Open"]}
      for enum, want in want_actions.items():
          m = re.search(r"enum %s \{(.*?)\n\}" % enum, src, re.S)
          got = re.findall(r"^    ([A-Z]\w*),?\s*$", m.group(1), re.M)
          if got != want:
              print(f"{p}:1: `{enum}` carries {got}, want closed {want}")
          if len(got) >= 12:
              print(f"{p}:1: `{enum}` has {len(got)} variants, keep noun tools under 12")
      want_params = {"SearchParams": "SearchAction", "ReplaceParams": "ReplaceAction", "ExportReadParams": "ExportReadAction", "ExportWriteParams": "ExportWriteAction"}
      for struct, action in want_params.items():
          m = re.search(r"struct %s \{(.*?)\n\}" % struct, src, re.S)
          body = m.group(1)
          if "    root_id: String," not in body or f"    action: {action}," not in body:
              print(f"{p}:1: `{struct}` must require exactly [root_id, action: {action}]")
          for f in re.findall(r"^    \w+: (.*?),?\s*$", body, re.M):
              inner = re.sub(r"^Option<(.*)>$", r"\1", f)
              if not re.match(r"^(String|bool|usize|u64|f32|[\w:]+(Action|Profile|Kind))$", inner):
                  print(f"{p}:1: `{struct}` field `{f}` breaks the flat object")
      ends = [i for i, l in enumerate(lines) if re.match(r"\s*\)\]\s*$", l)]
      starts = [i for i, l in enumerate(lines) if l.lstrip().startswith("#[tool(")]
      for s in starts:
          e = min(x for x in ends if x > s)
          k = e + 1
          while not re.match(r"\s*fn (\w+)", lines[k]):
              k += 1
          name = re.match(r"\s*fn (\w+)", lines[k]).group(1)
          if name in ["search", "replace", "export_read", "export_write"]:
              d = re.search(r"description = \"(.*)\"", "".join(lines[s:e + 1]), re.S).group(1)
              n = len([x for x in re.split(r"\.\s+", d.strip()) if x])
              if not 2 <= n <= 4:
                  print(f"{p}:{s + 1}: `{name}` description runs {n} sentences, keep 2-4")
      '
    files: '^src-tauri/mcp/src/lib\.rs$'
    message: a grouped noun tool drifted from the flat-object recipe
    why: >-
      each noun tool carries one action enum under 12 variants with the valid list and a did-you-mean hint, requires exactly [root_id, action], stays a flat object of scalars and small enums, and describes its actions in 2-4 sentences instead of growing per-noun *_schema tools (twins search_validates_per_action, replace_token_flow, export_read_validates_per_action, export_write_validates_per_action and search_and_replace_reject_unknown_fields at src-tauri/mcp/src/lib.rs:3716,3775,2479,2557,3892).
    fix: >-
      add the action to the noun tool's enum with its per-action validation, or split the noun deliberately with the twins.
